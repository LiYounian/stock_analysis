{% extends "base.html" %}{% block content %}<h1>{{code}} <small>{{strategy}} · 入选 {{signal_date}}</small></h1><section class="card wide"><h2>入选后表现</h2><p>入选收盘：{{'%.2f'|format(entry) if entry else '—'}}　最新收盘：{{'%.2f'|format(latest)}}　截至最新涨跌：<b>{{return_pct if return_pct is not none else '—'}}%</b></p><div id="klineChart" style="height:520px"></div></section>{% endblock %}{% block scripts %}<script id="klineData" type="application/json">{{kline|tojson}}</script><script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script><script src="/static/kline_echarts.js"></script>{% endblock %}
