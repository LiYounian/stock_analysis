<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>A股资金流向</title>
<style>
  :root {
    --bg: #f7f8fa;
    --card: #ffffff;
    --border: #ececec;
    --text: #1f2328;
    --sub: #8a8f98;
    --red: #ef4444;
    --red-soft: #fde2e2;
    --green: #16a34a;
    --green-soft: #dcf5e2;
    --shadow: 0 1px 2px rgba(0,0,0,.03), 0 8px 20px rgba(0,0,0,.04);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased; }
  body { padding: 12px 12px calc(24px + env(safe-area-inset-bottom)); max-width: 960px; margin: 0 auto; }

  .header {
    text-align: center;
    padding: 6px 0 10px;
    position: relative;
  }
  .header .title {
    font-size: 16px;
    font-weight: 600;
    letter-spacing: .5px;
  }
  .header .title .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: #ef4444; vertical-align: middle; margin: 0 6px; transform: translateY(-2px); }
  .header .disclaimer {
    font-size: 11px;
    color: var(--sub);
    margin-top: 4px;
  }
  .header .refresh {
    position: absolute;
    right: 4px;
    top: 6px;
    font-size: 11px;
    color: var(--sub);
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .live {
    width: 6px; height: 6px; border-radius: 50%;
    background: #16a34a;
    box-shadow: 0 0 0 0 rgba(22,163,74,.6);
    animation: pulse 1.6s infinite;
  }
  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0 rgba(22,163,74,.55); }
    70%  { box-shadow: 0 0 0 8px rgba(22,163,74,0); }
    100% { box-shadow: 0 0 0 0 rgba(22,163,74,0); }
  }

  .summary {
    display: grid;
    grid-template-columns: repeat(5, minmax(0,1fr));
    gap: 6px;
    margin: 8px 0 14px;
  }
  .cell {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 6px 8px;
    text-align: center;
    box-shadow: var(--shadow);
    position: relative;
    overflow: hidden;
  }
  .cell .label {
    font-size: 13px;
    color: #444;
    font-weight: 500;
  }
  .cell .val {
    font-size: 14px;
    margin-top: 8px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }
  .cell .bar {
    height: 4px;
    border-radius: 3px;
    margin-top: 6px;
    background: #eee;
    overflow: hidden;
    position: relative;
  }
  .cell.up   { background: linear-gradient(180deg, #fff5f5 0%, #fff 60%); }
  .cell.up   .val { color: var(--red); }
  .cell.up   .bar { background: var(--red-soft); }
  .cell.down { background: linear-gradient(180deg, #f2fbf4 0%, #fff 60%); }
  .cell.down .val { color: var(--green); }
  .cell.down .bar { background: var(--green-soft); }

  .tabs {
    display: flex;
    background: #eef0f3;
    border-radius: 999px;
    padding: 3px;
    margin: 0 auto 12px;
    width: fit-content;
    font-size: 13px;
  }
  .tabs button {
    border: 0;
    background: transparent;
    padding: 6px 16px;
    border-radius: 999px;
    color: #555;
    cursor: pointer;
    font-weight: 500;
  }
  .tabs button.active {
    background: #fff;
    color: #111;
    box-shadow: 0 1px 2px rgba(0,0,0,.06);
  }

  .list-wrap {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px 8px;
  }
  @media (max-width: 640px) {
    .list-wrap { grid-template-columns: 1fr; }
    .summary { gap: 4px; }
    .cell .label { font-size: 12px; }
    .cell .val { font-size: 12px; }
  }

  .row {
    background: var(--card);
    border-radius: 10px;
    padding: 10px 12px;
    display: grid;
    grid-template-columns: 24px 1fr 20px 90px 84px;
    align-items: center;
    gap: 8px;
    box-shadow: 0 1px 1px rgba(0,0,0,.02);
    position: relative;
    overflow: hidden;
  }
  .row .star {
    cursor: pointer;
    font-size: 15px;
    line-height: 1;
    color: #d0d3d8;
    user-select: none;
    text-align: center;
    transition: transform .1s;
  }
  .row .star:hover { transform: scale(1.15); }
  .row .star.on { color: #f5b301; }

  /* 搜索栏 */
  .toolbar {
    display: flex;
    gap: 8px;
    align-items: center;
    margin: 0 0 10px;
  }
  .search-wrap {
    flex: 1;
    position: relative;
  }
  .search-wrap input {
    width: 100%;
    height: 34px;
    padding: 0 30px 0 32px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: #fff;
    font-size: 13px;
    color: var(--text);
    outline: none;
    box-sizing: border-box;
  }
  .search-wrap input:focus { border-color: #c9cdd4; }
  .search-wrap .ico {
    position: absolute; left: 11px; top: 50%; transform: translateY(-50%);
    color: var(--sub); font-size: 14px; pointer-events: none;
  }
  .search-wrap .clear {
    position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
    color: #b0b4bb; font-size: 14px; cursor: pointer; display: none;
    width: 18px; height: 18px; line-height: 16px; text-align: center; border-radius: 50%;
    background: #eef0f3;
  }
  .search-wrap .clear.show { display: block; }
  .empty {
    text-align: center;
    color: var(--sub);
    padding: 40px 12px;
    font-size: 13px;
    grid-column: 1 / -1;
  }
  .empty .big { font-size: 24px; margin-bottom: 6px; }
  .fav-count {
    display: inline-block;
    min-width: 16px;
    padding: 0 5px;
    height: 16px;
    line-height: 16px;
    border-radius: 8px;
    background: #f5b301;
    color: #fff;
    font-size: 10px;
    font-weight: 600;
    margin-left: 4px;
    vertical-align: 1px;
  }
  .row .rank {
    color: var(--sub);
    font-size: 13px;
    font-variant-numeric: tabular-nums;
    text-align: center;
  }
  .row .name {
    font-size: 14px;
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .row .track {
    height: 6px;
    border-radius: 4px;
    background: #f1f1f1;
    overflow: hidden;
    position: relative;
  }
  .row .fill {
    height: 100%;
    border-radius: 4px;
  }
  .row .amount {
    font-size: 13px;
    text-align: right;
    font-variant-numeric: tabular-nums;
    font-weight: 500;
  }
  .row.up    { background: linear-gradient(90deg, #fff3f3 0%, #ffffff 55%); }
  .row.up    .track { background: var(--red-soft); }
  .row.up    .fill  { background: linear-gradient(90deg, #ff8686, #ef4444); }
  .row.up    .amount{ color: var(--red); }
  .row.up    .rank  { background: var(--red); color: #fff; border-radius: 4px; font-weight: 600; }
  .row.up.top3 { border-left: 3px solid #ef4444; }
  .row.down  .track { background: var(--green-soft); }
  .row.down  .fill  { background: linear-gradient(90deg, #86e0a0, #16a34a); }
  .row.down  .amount{ color: var(--green); }

  .row .dot {
    display: inline-block;
    width: 6px; height: 6px; border-radius: 50%;
    margin-right: 4px;
    vertical-align: middle;
  }
  .row.up   .dot { background: #ef4444; }
  .row.down .dot { background: #16a34a; }

  .footer {
    margin-top: 14px;
    font-size: 11px;
    color: var(--sub);
    text-align: center;
  }
  .error {
    background: #fff3cd;
    color: #664d03;
    padding: 8px 12px;
    border-radius: 8px;
    font-size: 12px;
    margin: 8px 0;
    text-align: center;
  }
  .updating .live { background: #f59e0b; }
</style>
</head>
<body>

<div class="header">
  <div class="title"><span class="dot"></span><span id="date-title">资金流向情况</span><span class="dot"></span></div>
  <div class="disclaimer">免责声明:数据均来源于市场信息，仅作科普，不构成投资建议</div>
  <div class="refresh"><span class="live" id="live"></span><span id="updated">--:--:--</span></div>
</div>

<div class="summary" id="summary">
  <div class="cell"><div class="label">小单</div><div class="val" data-k="small">--</div><div class="bar"></div></div>
  <div class="cell"><div class="label">中单</div><div class="val" data-k="mid">--</div><div class="bar"></div></div>
  <div class="cell"><div class="label">大单</div><div class="val" data-k="big">--</div><div class="bar"></div></div>
  <div class="cell"><div class="label">超大</div><div class="val" data-k="huge">--</div><div class="bar"></div></div>
  <div class="cell"><div class="label">主力</div><div class="val" data-k="main">--</div><div class="bar"></div></div>
</div>

<div class="tabs" id="tabs">
  <button data-t="all" class="active">全部</button>
  <button data-t="2">行业板块</button>
  <button data-t="3">概念板块</button>
  <button data-t="fav">★收藏<span class="fav-count" id="fav-count" style="display:none">0</span></button>
</div>

<div class="toolbar">
  <div class="search-wrap">
    <span class="ico">🔍</span>
    <input id="search" type="text" placeholder="搜索板块名，如 半导体 / 银行 / CPO" autocomplete="off" />
    <span class="clear" id="search-clear" title="清空">×</span>
  </div>
</div>

<div id="error" class="error" style="display:none"></div>

<div class="list-wrap" id="list"></div>

<div class="footer">数据来源：东方财富 · 每 30 秒自动刷新</div>

<script>
(function () {
  var REFRESH_MS = 30 * 1000;
  var sectorType = "all"; // "all" | "2" | "3" | "fav"
  var refreshTimer = null;
  var searchQuery = "";
  var allSectors = [];  // 最近一次拉到的合并板块列表
  var FAV_KEY = "fund_flow_favs_v1";
  var favs = loadFavs();  // Set of sector names

  function loadFavs() {
    try {
      var raw = localStorage.getItem(FAV_KEY);
      if (!raw) return new Set();
      var arr = JSON.parse(raw);
      return new Set(Array.isArray(arr) ? arr : []);
    } catch (e) { return new Set(); }
  }
  function saveFavs() {
    try { localStorage.setItem(FAV_KEY, JSON.stringify(Array.from(favs))); } catch (e) {}
  }
  function toggleFav(name) {
    if (favs.has(name)) favs.delete(name);
    else favs.add(name);
    saveFavs();
    updateFavCount();
    applyFilter();
  }
  function updateFavCount() {
    var el = document.getElementById("fav-count");
    if (!el) return;
    if (favs.size > 0) {
      el.style.display = "inline-block";
      el.textContent = String(favs.size);
    } else {
      el.style.display = "none";
    }
  }

  // 多域名轮询: 主推 delay 集群 (免限流), 出错自动降级到主域
  var HOSTS = [
    "https://push2delay.eastmoney.com",
    "https://push2.eastmoney.com"
  ];

  function jsonp(path, params) {
    var qs = Object.keys(params).map(function (k) { return encodeURIComponent(k) + "=" + encodeURIComponent(params[k]); }).join("&");
    var lastErr = null;
    var i = 0;

    function tryHost() {
      if (i >= HOSTS.length) return Promise.reject(lastErr || new Error("all hosts failed"));
      var full = HOSTS[i] + path + "?" + qs;
      return fetch(full, { credentials: "omit", cache: "no-store" })
        .then(function (r) {
          if (!r.ok) throw new Error("http " + r.status);
          return r.json();
        })
        .then(function (data) {
          if (!data || data.rc !== 0) throw new Error("bad payload rc=" + (data && data.rc));
          return data;
        })
        .catch(function (err) {
          lastErr = err;
          i++;
          return tryHost();
        });
    }
    return tryHost();
  }

  function fmtYi(v) {
    // v in 元, convert to 亿, 2 decimals, with sign
    if (v == null || isNaN(v)) return "--";
    var y = v / 1e8;
    var sign = y > 0 ? "+" : (y < 0 ? "-" : "");
    return sign + Math.abs(y).toFixed(2) + "亿";
  }
  function fmtDateHeader() {
    var d = new Date();
    var mm = String(d.getMonth() + 1).padStart(2, "0");
    var dd = String(d.getDate()).padStart(2, "0");
    var h = d.getHours();
    var period = h < 12 ? "上午" : (h < 18 ? "下午" : "晚间");
    return mm + "月" + dd + "日" + period + " 资金流向情况";
  }
  function fmtTime() {
    var d = new Date();
    return [d.getHours(), d.getMinutes(), d.getSeconds()].map(function (n) { return String(n).padStart(2, "0"); }).join(":");
  }

  async function fetchMarketFlow() {
    // 沪市(000001) + 深证(399001) 汇总，得到整个A股主力/超大/大/中/小单净流入
    // 字段:  f62=主力  f66=超大  f72=大  f78=中  f84=小
    var data = await jsonp("/api/qt/ulist.np/get", {
      fltt: 2,
      secids: "1.000001,0.399001",
      fields: "f62,f66,f72,f78,f84,f184",
      ut: "b2884a393a59ad64002292a3e90d46a5"
    });
    if (!data || !data.data || !data.data.diff || !data.data.diff.length) throw new Error("empty market data");
    var rows = data.data.diff;
    var sum = { main: 0, huge: 0, big: 0, mid: 0, small: 0 };
    rows.forEach(function (r) {
      sum.main  += Number(r.f62) || 0;
      sum.huge  += Number(r.f66) || 0;
      sum.big   += Number(r.f72) || 0;
      sum.mid   += Number(r.f78) || 0;
      sum.small += Number(r.f84) || 0;
    });
    return sum;
  }

  async function fetchOneSectorType(type) {
    // fs=m:90+t:2 = 行业板块, t:3 = 概念板块
    // 接口单次最多 100 条; po=1 降序拿净流入榜, po=0 升序拿净流出榜, 合并即两端全覆盖
    function fetchSide(po) {
      return jsonp("/api/qt/clist/get", {
        pn: 1,
        pz: 100,
        po: po,
        np: 1,
        fltt: 2,
        invt: 2,
        fid: "f62",
        fs: "m:90+t:" + type,
        fields: "f12,f14,f62",
        ut: "b2884a393a59ad64002292a3e90d46a5"
      }).catch(function () { return null; });
    }
    var res = await Promise.all([fetchSide(1), fetchSide(0)]);
    var out = [];
    res.forEach(function (d) {
      if (!d || !d.data || !d.data.diff) return;
      var diff = d.data.diff;
      var list = Array.isArray(diff) ? diff : Object.keys(diff).map(function (k) { return diff[k]; });
      list.forEach(function (r) {
        if (!r || !r.f14) return;
        out.push({ code: r.f12, name: r.f14, main: parseFloat(r.f62) || 0, kind: type });
      });
    });
    return out;
  }

  async function fetchAllSectors() {
    var res = await Promise.all([fetchOneSectorType("2"), fetchOneSectorType("3")]);
    var lists = res[0].concat(res[1]);
    // 过滤子级板块 (名字里带 Ⅱ / Ⅲ 的)
    lists = lists.filter(function (r) { return !/[ⅡⅢ]/.test(r.name); });
    // 按板块名去重 (行业+概念可能有同名, 保留主力净额绝对值较大的一条; 同时记录 kind 兼有)
    var byName = {};
    lists.forEach(function (r) {
      var cur = byName[r.name];
      if (!cur) { byName[r.name] = { code: r.code, name: r.name, main: r.main, kinds: [r.kind] }; return; }
      if (cur.kinds.indexOf(r.kind) < 0) cur.kinds.push(r.kind);
      if (Math.abs(r.main) > Math.abs(cur.main)) { cur.main = r.main; cur.code = r.code; }
    });
    return Object.keys(byName).map(function (k) { return byName[k]; });
  }

  function renderSummary(m) {
    var map = { small: m.small, mid: m.mid, big: m.big, huge: m.huge, main: m.main };
    var cells = document.querySelectorAll(".cell");
    cells.forEach(function (c) {
      var el = c.querySelector(".val");
      var k = el.getAttribute("data-k");
      var v = map[k];
      el.textContent = fmtYi(v);
      c.classList.remove("up", "down");
      if (v > 0) c.classList.add("up");
      else if (v < 0) c.classList.add("down");
    });
  }

  // 根据当前 tab + 搜索词过滤 allSectors, 然后渲染
  function applyFilter() {
    var wrap = document.getElementById("list");
    if (!allSectors || allSectors.length === 0) { wrap.innerHTML = ""; return; }

    var view = allSectors.slice();
    if (sectorType === "2" || sectorType === "3") {
      view = view.filter(function (s) { return s.kinds.indexOf(sectorType) >= 0; });
    } else if (sectorType === "fav") {
      view = view.filter(function (s) { return favs.has(s.name); });
    }
    if (searchQuery) {
      var q = searchQuery.toLowerCase();
      view = view.filter(function (s) { return s.name.toLowerCase().indexOf(q) >= 0; });
    }
    view.sort(function (a, b) { return b.main - a.main; });

    if (view.length === 0) {
      var msg;
      if (sectorType === "fav" && !searchQuery) {
        msg = '<div class="empty"><div class="big">★</div>还没有收藏的板块<br/>在其他 tab 里点击板块前的星标即可收藏</div>';
      } else if (searchQuery) {
        msg = '<div class="empty">没有匹配「' + escapeHtml(searchQuery) + '」的板块</div>';
      } else {
        msg = '<div class="empty">暂无数据</div>';
      }
      wrap.innerHTML = msg;
      return;
    }

    var maxAbs = 0;
    view.forEach(function (s) {
      var a = Math.abs(s.main);
      if (a > maxAbs) maxAbs = a;
    });
    if (maxAbs <= 0) maxAbs = 1;

    // 双列: 上到下再下一列 (与截图一致)
    var n = view.length;
    var half = Math.ceil(n / 2);
    var reordered = new Array(n);
    for (var i = 0; i < half; i++) {
      reordered[i * 2] = view[i];
      if (i + half < n) reordered[i * 2 + 1] = view[i + half];
    }
    reordered = reordered.filter(Boolean);

    var html = reordered.map(function (s) {
      var rank = view.indexOf(s) + 1;
      var up = s.main >= 0;
      var pct = Math.min(100, Math.abs(s.main) / maxAbs * 100);
      var isFav = favs.has(s.name);
      var cls = "row " + (up ? "up" : "down") + (up && rank <= 3 ? " top3" : "");
      return '<div class="' + cls + '">' +
        '<div class="rank">' + rank + '</div>' +
        '<div class="name">' + escapeHtml(s.name) + '</div>' +
        '<div class="star ' + (isFav ? 'on' : '') + '" data-name="' + escapeHtml(s.name) + '" title="' + (isFav ? '取消收藏' : '收藏') + '">' + (isFav ? '★' : '☆') + '</div>' +
        '<div class="track"><div class="fill" style="width:' + pct.toFixed(1) + '%"></div></div>' +
        '<div class="amount"><span class="dot"></span>' + fmtYi(s.main) + '</div>' +
        '</div>';
    }).join("");
    wrap.innerHTML = html;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c];
    });
  }

  function setError(msg) {
    var el = document.getElementById("error");
    if (!msg) { el.style.display = "none"; el.textContent = ""; return; }
    el.style.display = "block";
    el.textContent = msg;
  }

  async function tick() {
    document.body.classList.add("updating");
    document.getElementById("date-title").textContent = fmtDateHeader();
    try {
      var results = await Promise.allSettled([
        fetchMarketFlow(),
        fetchAllSectors(),
      ]);
      var mkt = results[0];
      var sec = results[1];
      if (mkt.status === "fulfilled") renderSummary(mkt.value);
      if (sec.status === "fulfilled") {
        allSectors = sec.value;
        applyFilter();
      }

      function reasonMsg(r) { return (r && r.reason && r.reason.message) || "unknown"; }
      if (mkt.status === "rejected" && sec.status === "rejected") {
        setError("数据获取失败：大盘 " + reasonMsg(mkt) + " ; 板块 " + reasonMsg(sec));
      } else if (mkt.status === "rejected") {
        setError("大盘数据获取失败：" + reasonMsg(mkt));
      } else if (sec.status === "rejected") {
        setError("板块数据获取失败：" + reasonMsg(sec));
      } else if (sec.status === "fulfilled" && (!sec.value || sec.value.length === 0)) {
        setError("板块接口返回空。可能被限流，30 秒后自动重试。");
      } else {
        setError("");
      }
      document.getElementById("updated").textContent = fmtTime();
    } catch (e) {
      setError("刷新出错：" + e.message);
    } finally {
      document.body.classList.remove("updating");
    }
  }

  function startLoop() {
    if (refreshTimer) clearInterval(refreshTimer);
    tick();
    refreshTimer = setInterval(tick, REFRESH_MS);
  }

  // Tab 切换: 纯客户端过滤, 不重发请求
  document.getElementById("tabs").addEventListener("click", function (e) {
    var btn = e.target.closest("button[data-t]");
    if (!btn) return;
    document.querySelectorAll("#tabs button").forEach(function (b) { b.classList.remove("active"); });
    btn.classList.add("active");
    sectorType = btn.getAttribute("data-t");
    applyFilter();
  });

  // 搜索框
  var searchEl = document.getElementById("search");
  var clearEl = document.getElementById("search-clear");
  searchEl.addEventListener("input", function () {
    searchQuery = searchEl.value.trim();
    clearEl.classList.toggle("show", !!searchQuery);
    applyFilter();
  });
  clearEl.addEventListener("click", function () {
    searchEl.value = "";
    searchQuery = "";
    clearEl.classList.remove("show");
    applyFilter();
    searchEl.focus();
  });

  // 列表点击: 星标切换 (事件委托)
  document.getElementById("list").addEventListener("click", function (e) {
    var star = e.target.closest(".star");
    if (!star) return;
    var name = star.getAttribute("data-name");
    if (name) toggleFav(name);
  });

  // 页面隐藏时暂停自动刷新
  document.addEventListener("visibilitychange", function () {
    if (document.hidden) {
      if (refreshTimer) { clearInterval(refreshTimer); refreshTimer = null; }
    } else {
      startLoop();
    }
  });

  updateFavCount();
  startLoop();
})();
</script>
</body>
</html>
