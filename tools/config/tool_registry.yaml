# 金字塔选股工具清单（SSOT）· Agent 开工先读它知道"有哪些工具"。
# 契约见 tools/pyramid/registry.py（统筹冻结）。P1a 落 entry_price（●已实现）；
# 其余 6 个由窗1/2/3 填实现后把 status 改 done、补 outputs/tests。
version: "P1-2026-09-18"
契约: tools/pyramid/registry.py
调用:
  api: "tools.pyramid.registry.get(name).run(as_of, code)"
  cli: "python -m tools.pyramid tool <name> --as-of D --code X"
铁律:
  - 产出浓缩块 ≤8 行；禁裸 json 进 prompt（G3）
  - 只信主档 K 线；688/689 量能 amount/close 自校（H2）
  - as_of 防未来（assert_no_future）
  - 每数值带【口径】【档位】【一句解释】；档位语义锁测试
tools:
  - name: entry_price
    塔层: "①塔基"
    status: done
    window: 统筹(样板)
    inputs: [as_of, code, "method?"]
    outputs: [挂单价, 止损价, 不追高上限, 现价, 止损幅pct, 单调性ok]
    freshness: 主档K线口径日期
    防未来: true
    reuse: tools.analysis.selection_synth.fill_entry_exit
    tests: tests/pyramid/test_framework.py
  - name: shared_pool
    塔层: "①塔基"
    status: done
    window: 窗1-量价工具族
    inputs: [as_of, "code?"]
    outputs: [池规模, 各来源命中数, 缺来源, 共识数, 命中来源]
    reuse: tools/experimental/pyramid_select_v1.py
    freshness: 主档K线口径日期 + data/analysis/<date> 来源文件
    防未来: true
    tests: tests/pyramid/test_shared_pool_tool.py
    note: "≥2策略并集∪council top∪板块roster∪Agent主线∪全A K线过闸；K线复核不给特权；缺来源标missing"
  - name: gate
    塔层: "①塔基"
    status: done
    window: 窗1-量价工具族
    inputs: [as_of, code]
    outputs: [层级, 触发原因, 收阳, 站上MA5, 站上前日高, 涨停, 极高位, 量比, pos60]
    freshness: 主档K线口径日期
    防未来: true
    tests: tests/pyramid/test_gate_tool.py
    note: "阈值写死+档位锁；688校正；T1量比≥1.5∧收阳∧站上MA5∧破前高∧未近涨停；涨停/极高位pos60≥0.95踢出"
  - name: price_volume
    塔层: "①塔基"
    status: done
    window: 窗1-量价工具族
    inputs: [as_of, code]
    outputs: [现价, 涨幅pct, 量比, 量比档, pos60, pos60档, 距60高pct, vsMA5pct, vsMA20pct, session]
    freshness: 主档K线口径日期
    防未来: true
    tests: tests/pyramid/test_price_volume_tool.py
    note: "session=收盘(走K线)；688 volume 修复(H2)；量比档/pos60档写死+语义锁"
  - name: sector_context
    塔层: "④宏观"
    status: done
    window: 窗2-板块
    inputs: [as_of, code]
    outputs: [板块, 重点标, focus_score, focus_score档, 冷热标签, 拥挤档, RS_pos60, RS档, 角色, 选级, 板块内排名, 新闻净催化, 净催化档, 环境命中日]
    freshness: sector_focus/regime ≤as_of 最近一日(as_of无当日→stale)
    防未来: true
    reuse: [config/code_industry.json, data/analysis/<date>/sector_focus.json, sector_regime.json, data/sector_roster(_table)/<板块>.json]
    tests: tests/pyramid/test_sector_context.py
    note: "每票6字段(板块/冷热拥挤/RS分位pos60/角色/板块内排名/净催化)；focus_score档；缺字段标missing不编；档位语义锁_FS档/_RS档/_净催化档/_拥挤含义/_冷热含义"
  - name: experience_rules
    塔层: "经验"
    status: done
    window: 窗3-经验与假利好
    inputs: [as_of, "code?", "环节?"]
    outputs: [命中数, 命中规则, 存疑数, 总库条数, 适用条数, 出处]
    freshness: 规则首见版本(≤as_of)；库晚于as_of标stale
    防未来: true
    reuse: docs/每日分析/经验沉淀/v*.md → data/analysis/经验规则库.json
    tests: tests/pyramid/test_experience_rules.py
    note: "拆712K散文为结构化规则库(规则/环节/状态/证据+首见版本防未来)；环节=召回/排雷/排序/价位/择时/通则；消除每日43K输入。构建:python -m tools.pyramid.tools.experience_rules_tool"
  - name: fake_good_news
    塔层: "②消息"
    status: done
    window: 窗3-经验与假利好
    inputs: [as_of, code]
    outputs: [嫌疑档, 命中数, 高开走弱, 放量长上影, 利好后回吐, 兑现日]
    freshness: 有events=fresh；无events=missing(仅K线保守判)
    防未来: true
    reuse: [per-stock events, 主档K线 D0/D0+1 价格行为]
    note: "档位:无嫌疑/低/中/高(写死);判据①近期利好②兑现日高开走弱/放量长上影③利好后回吐(程序无记忆补丁);无events标missing不编"
  - name: financial_redflag
    塔层: "③塔身"
    status: done
    window: P2(统筹)
    inputs: [as_of, code]
    outputs: [嫌疑档, 判据, 评级, quality_score, quality档, five_dims, 弱项维度, flags, 报告期]
    freshness: 有financial=fresh；无=missing
    防未来: true
    reuse: data/analysis/<date>/<code>.json 的 financial
    tests: tests/pyramid/test_financial_redflag.py
    note: "填9-17三方分歧缺口(002025财报差被DeepSeek买);档位:高危/中/低/无嫌疑(写死);quality档80/65/50/35(D1§4);接入d2_compose排雷子分"
  - name: unlock_risk
    塔层: "②消息"
    status: done
    window: 四因子#1(解禁)
    inputs: [as_of, code]
    outputs: [解禁嫌疑档, 剩余天数, 占流通pct, 下一次日期, 不可采信, 未来90日次数, 占比口径]
    freshness: 有financing.解禁=fresh；无=missing
    防未来: true
    reuse: data/analysis/<date>/<code>.json 的 financing.解禁
    tests: tests/pyramid/test_unlock_risk.py
    note: "临近限售解禁抛压(负向·消息面);档位:高危/中/低/无嫌疑(写死·占流通3%/10%×剩余30/90日);剩余天数=下一次.解禁日-as_of自算(防未来·不信采集相对距今日);披露日>as_of或已过则不可见;占比用未来90日占流通_pct(已剔不可采信)→退下一次占比;接d2_compose排雷子分(中-25/低-10)+高危veto大额解禁临近"
  - name: insider_reduction
    塔层: "②消息"
    status: done
    window: 四因子#2(减持)
    inputs: [as_of, code]
    outputs: [减持嫌疑档, 命中条数, 最近减持日, 方式标签, 主体标签, 窗内候选数]
    freshness: 有events=fresh；无events=missing
    防未来: true
    reuse: data/analysis/<date>/<code>.json 的 events(type∈{减持,权益变动})
    tests: tests/pyramid/test_insider_reduction.py
    note: "大股东减持抛压(负向·消息面·镜像fake_good_news);v1标题级粗判;候选=type∈{减持,权益变动}且as_of前30日内且date≤as_of(防未来);逐条严重度:中性(协议转让/引入战投/业务协同/增持/未减持 或impact利好)不计/高(清仓式或控股股东+大额)/中单条(大额/预披露)/常规;档位(写死)无嫌疑/低/中/高;高走veto清仓式减持;接d2_compose排雷子分(中-25/低-12);只走events不碰holder(股东户数)/fundflow(主力);减持低频多数票窗内0条属正常;v2需新采occ量化占流通%×主体×方式"
