# 统一定时任务注册表(SSOT · 架构⑥ P1)
# ────────────────────────────────────────────────────────────────────────
# 加任务 = 加一条 → 注册即被调度;改时间 = 改 cron → 热生效(无需 launchctl)。
# cron 为标准 5 段 crontab:分 时 日 月 周。
#   ⚠️ 周字段务必用名字 mon-fri:APScheduler from_crontab 的数字周是 0=周一,
#      写 "1-5" 会错成 周二~周六;用 mon-fri 才是周一~周五。
# 凭证不入库:命令里不含任何 key/token;告警 webhook 走 env 变量名(见 notifier)。
#
# ⚠️ P1 影子期:本表仅供 APScheduler dry-run/影子排期与告警验证,
#    与 live launchd 并行观察一致性;**不替代、不改动 live launchd**。
#    实际切换是 P3 人工 gated 步骤(见 docs/参考 runbook)。
# ────────────────────────────────────────────────────────────────────────
tasks:
  - id: intraday
    description: 盘中快照(上午 10:30 slot)
    cmd: ["python", "-m", "tools.pipeline.intraday_snapshot", "--slot", "1030"]
    cron: "30 10 * * mon-fri"
    timeout_sec: 600
    retries: 1
    notify_on: [failure, misfire]
    tags: [local, intraday]

  - id: intraday_noon
    description: 午盘快照(11:31 slot,与 intraday 同脚本不同 slot)
    cmd: ["python", "-m", "tools.pipeline.intraday_snapshot", "--slot", "1131"]
    cron: "31 11 * * mon-fri"
    timeout_sec: 600
    retries: 1
    notify_on: [failure, misfire]
    tags: [local, intraday]

  - id: intraday_screen
    description: 午盘全A选股(11:32,午休对全A挑票)
    cmd: ["python", "-m", "tools.run", "intraday_screen"]
    cron: "32 11 * * mon-fri"
    timeout_sec: 1800
    retries: 1
    depends_on: [intraday_noon]
    notify_on: [failure, misfire]
    tags: [local, intraday, screen]

  # headless 午盘深度选股(方案b·launchd 免漂移):读 intraday_screen 阶段1早产候选→逐票 DeepSeek 深度→
  # 产 日内深度_<date>.md(灰度独立名,不碰 日内_/watch)。**灰度期草案,plist 未装载**(enabled:false):
  # 换线(launchctl load + 停/改 Claude noon SKILL + 接 watch)由用户/统筹在灰度~3-5交易日确认后做。
  # cron 须与 com.stock.intraday_deep.plist 的 11:50 mon-fri 等价(等价测试护)。
  - id: intraday_deep
    description: headless 午盘深度选股(11:50,读stage1候选逐票DeepSeek深度;灰度草案未装载)
    cmd: ["python", "-m", "tools.run", "intraday_deep"]
    cron: "50 11 * * mon-fri"
    timeout_sec: 1800
    retries: 1
    depends_on: [intraday_screen]
    notify_on: [failure, misfire]
    enabled: false
    tags: [local, intraday, deep, gray]

  - id: intraday_watch
    description: 下午实时观测循环(13:00 起动,脚本内 --until 14:57 自停)
    cmd: ["python", "-m", "tools.pipeline.intraday_watch", "--until", "14:57", "--interval", "300"]
    cron: "0 13 * * mon-fri"
    timeout_sec: 7800
    retries: 0
    notify_on: [failure, misfire]
    tags: [local, intraday, watch]

  # 消息驱动板块研判每日(工作日 14:00·下午不冲突时段):【2026-09-16 升级·程序化流水线 S3→S4 链】
  # live sh(sector_news_catalyst.sh)重指向:先跑 S3 board_news_collect_run(读S2表→定向采集 龙头/中军/主力
  #   新闻+政策+国际+LHB → raw 过程文件·只抓不判无 LLM)→ 再跑 S4 board_verdict_run(读raw→DeepSeek-v4-pro
  #   思考关 按 rubric 文字分级研判+去重增量 → catalyst_<date>.json 全板块 + 扩 sector_focus 消息驱动块)。
  #   retire 内部耦合的 news_catalyst_run(采集与研判解耦为两阶段·全板块覆盖)。供选股利好板块→深度分析支撑路径。
  # plist=com.stock.sector_news_catalyst.plist;**用户已 launchctl load(live);plist 路径不变→下个14:00自动跑升级链、无需reload**。
  # cron 与 plist 的 14:00 mon-fri 严格等价(test_scheduler_launchd_equivalence 锁)。cmd 记 S4 终点模块(S3 由 sh 前置)。
  - id: sector_news_catalyst
    description: "消息驱动板块研判(14:00·S3采集→S4研判链);全板块DeepSeek rubric文字分级+去重;live升级内核,同slot"
    cmd: ["python", "-m", "tools.analysis.sector_forecast.board_verdict_run"]
    cron: "0 14 * * mon-fri"
    timeout_sec: 1800
    retries: 1
    enabled: false
    notify_on: [failure, misfire]
    tags: [local, afternoon, sector, news]

  # 程序化流水线 S1(周度·纯量价无 LLM):全申万一级板块清单 + 热门标记 + 与上周 diff →
  # data/analysis/sector_universe.json + history 归档。解决"板块只 10 个"。每周六 18:00(周末离线维护)。
  # plist=com.stock.sector_universe.plist(草案);**enabled:false + 待用户 launchctl 装载**。
  # cron 与 plist 的 周六18:00 严格等价(test_scheduler_launchd_equivalence 锁)。前置:S1 代码已合 main。
  # (2026-09 由周一调整为周六:以 LIVE ~/Library/LaunchAgents 现值为准,仓库源对齐。)
  - id: sector_universe
    description: "S1 板块universe周维护(周六18:00);全申万一级+热门标记+上周diff;纯量价;草案待装载,默认关"
    cmd: ["python", "-m", "tools.analysis.sector_forecast.sector_universe_run"]
    cron: "0 18 * * sat"
    timeout_sec: 900
    retries: 1
    enabled: false
    notify_on: [failure, misfire]
    tags: [local, weekly, sector, universe]

  # 程序化流水线 S2(周度·纯量价+龙虎榜净买proxy无 LLM):读 S1 全板块 → 五角色(龙头/中军/先锋/弹性/主力)+
  # 周度变更留痕 → data/sector_roster_table/<板块>.json + changes/roster_changes_<周>.md。保留每日 roles 版对照。
  # 每周六 18:30(排在 S1 18:00 之后,读本周 universe)。plist=com.stock.sector_roster_table.plist(草案);
  # **enabled:false + 待用户 launchctl 装载**。cron 与 plist 的 周六18:30 严格等价。前置:S2 代码已合 main。
  # (2026-09 由周一调整为周六:以 LIVE ~/Library/LaunchAgents 现值为准,仓库源对齐。)
  - id: sector_roster_table
    description: "S2 角色关系表周维护(周六18:30);五角色含主力LHB proxy+周度变更留痕;纯量价;草案待装载,默认关"
    cmd: ["python", "-m", "tools.analysis.sector_forecast.sector_roster_table_run"]
    cron: "30 18 * * sat"
    timeout_sec: 1800
    retries: 1
    enabled: false
    notify_on: [failure, misfire]
    tags: [local, weekly, sector, roster]

  - id: breadth
    description: 市场宽度(收盘后 15:05)
    cmd: ["python", "-m", "tools.pipeline.market_breadth", "--slot", "1505"]
    cron: "5 15 * * mon-fri"
    timeout_sec: 900
    retries: 1
    notify_on: [failure, misfire]
    tags: [local, eod]

  # Live capitulation 信号(收盘后 15:20,在 breadth 15:05 之后、选股之前):当日全A广度是否
  # 触发极端底部(β 择时),供次日选股读。plist=com.stock.capitulation_signal.plist(草案);
  # **enabled:false + 待统筹审后 launchctl 装载**(建-not-切,本条为 SSOT 留痕 + 等价测试比对锚)。
  # cron 与 plist 的 15:20 mon-fri 排期严格等价(test_scheduler_launchd_equivalence 锁)。
  - id: capitulation_signal
    description: "capitulation 信号(收盘后 15:20);β择时豁免用,只门控t+1;草案待换线装载,默认关"
    cmd: ["python", "-m", "tools.pipeline.capitulation_signal"]
    cron: "20 15 * * mon-fri"
    timeout_sec: 900
    retries: 1
    enabled: false
    notify_on: [failure, misfire]
    tags: [local, eod, capitulation]

  # 午盘全A重筛(工作日 11:35,抢 13:00 前):全A量价重筛→尾盘候选。plist=com.stock.noon_fullA_screen.plist。
  - id: noon_fullA_screen
    description: "午盘全A重筛(11:35);全A量价重筛→尾盘回踩限价候选;正式午盘选股(踏空根治)"
    cmd: ["python", "-m", "tools.pipeline.noon_fullA_screen"]
    cron: "35 11 * * mon-fri"
    timeout_sec: 900
    retries: 1
    notify_on: [failure, misfire]
    tags: [local, intraday, noon]

  # P-B 情绪判官 forward-shadow(工作日 20:00,闭环后):LLM 判申万一级行业情绪→shadow。non-gating 纯记录。
  - id: sentiment_shadow
    description: "P-B 情绪判官 forward-shadow(20:00);LLM 判行业情绪 A/B+净A度;non-gating 攒样本"
    cmd: ["python", "-m", "tools.analysis.industry_temp.sentiment_judge"]
    cron: "0 20 * * mon-fri"
    timeout_sec: 1800
    retries: 1
    notify_on: [failure, misfire]
    tags: [local, forward-shadow, regime]

  # ④ 消息驱动板块拐点 forward-shadow(工作日 20:30,情绪 shadow 之后):板块拐点+成员候选→advisory。non-gating。
  - id: sector_inflection_shadow
    description: "④ 板块拐点 forward-shadow(20:30);价量+情绪拐点+成员候选;non-gating 攒样本"
    cmd: ["python", "-m", "tools.research.sector_inflection"]
    cron: "30 20 * * mon-fri"
    timeout_sec: 900
    retries: 1
    notify_on: [failure, misfire]
    tags: [local, forward-shadow, regime]

  # C 宏观/板块级消息规避 forward-shadow(工作日 20:45):加息/汇率/关税→板块规避标记。non-gating。
  - id: sector_macro_avoid_shadow
    description: "C 宏观板块规避 forward-shadow(20:45);加息/汇率/关税→板块规避;non-gating 攒样本"
    cmd: ["python", "-m", "tools.research.sector_macro_avoid"]
    cron: "45 20 * * mon-fri"
    timeout_sec: 900
    retries: 1
    notify_on: [failure, misfire]
    tags: [local, forward-shadow, regime]

  # B 基本面 veto 误杀追踪 forward-shadow(工作日 21:00):价量强但被 veto 票→跟次日绝对收益。non-gating。
  - id: veto_track_shadow
    description: "B veto 误杀追踪 forward-shadow(21:00);价量强被veto票→次日绝对收益;non-gating 攒样本"
    cmd: ["python", "-m", "tools.research.veto_track"]
    cron: "0 21 * * mon-fri"
    timeout_sec: 900
    retries: 1
    notify_on: [failure, misfire]
    tags: [local, forward-shadow, avoidance]

  # 消息驱动板块选股 M3 forward 记分器(工作日 21:15,veto_track 21:00 之后·闭环末端):
  # 读当日 sector_focus 消息驱动块(缺则回退真 catalyst 官方转换)→ 回踩限价入场→记 D+1/D+2 绝对收益。
  # 龙头(个股催化)与跟涨(补涨联动观察)严格分开、分层;non-gating·纯记录·**绝不接 live 选股/不写 sector_focus**。
  # plist=com.stock.sector_news_forward_shadow.plist(草案);**enabled:false + 待用户 launchctl 装载**。
  # cron 与 plist 的 21:15 mon-fri 严格等价(test_scheduler_launchd_equivalence 锁)。
  - id: sector_news_forward_shadow
    description: "消息驱动板块选股 forward 记分器(21:15);龙头/跟涨分列·回踩限价→D+1/D+2 绝对收益;non-gating 攒样本"
    cmd: ["python", "-m", "tools.research.sector_news_forward"]
    cron: "15 21 * * mon-fri"
    timeout_sec: 900
    retries: 1
    enabled: false
    notify_on: [failure, misfire]
    tags: [local, forward-shadow, sector, news]

  # 板块预测系统每日 runner(工作日 19:45,闭环后·shadow批前):产 sector_focus/market_daily/roster。
  # forward-shadow·non-gating·不接生产选股(接入 gated 待 B' 覆盖验证)。plist=com.stock.sector_forecast.plist。
  # 已被 sector_daily(17:30) 取代:两者调用同一 CLI=重复;17:30 排在 18:36 晚间选股前(同日可喂研判),
  # 19:45 在选股后只能次日用。2026-09-16 收敛:停用本条、启用 sector_daily。plist 待用户 launchctl unload。
  - id: sector_forecast
    description: "[已停用·被 sector_daily(17:30)取代] 板块预测系统 runner(19:45);同一 CLI 重复,收敛留 17:30"
    cmd: ["python", "-m", "tools.analysis.sector_forecast"]
    cron: "45 19 * * mon-fri"
    timeout_sec: 900
    retries: 1
    enabled: false
    notify_on: [failure, misfire]
    tags: [local, eod, regime]

  - id: pullrefresh
    description: 盘后全量刷新/全A选股(15:40,约 1 小时)
    cmd: ["python", "-m", "tools.run", "screenall"]
    cron: "40 15 * * mon-fri"
    timeout_sec: 5400
    retries: 1
    retry_backoff_sec: 60
    notify_on: [failure, misfire]
    tags: [local, eod, heavy]

  # 板块预测系统每日研判产出(收盘后 17:30,排在 pullrefresh 之后:需 master kline / sentiment_policy 就绪)。
  # 产出 sector_regime/roster/sector_focus/sector_daily.md/market_daily.md/sector_news 落主仓 data,
  # 作**人工/研判辅助**(2026-09-16 定案:不机械接入生产选股;双跑仅证伪粗暴自动接法)。
  # plist=com.stock.sector_daily.plist;**唯一在编的板块日更 job**(2026-09-16 收敛:取代 19:45 sector_forecast)。
  # 17:30 排在 pullrefresh(15:40) 之后、18:36 晚间选股之前 → 板块研判同日可喂选股(消息驱动方向下选股要读板块利好标签)。
  # cron 与 plist 的 17:30 mon-fri 严格等价(test_scheduler_launchd_equivalence 锁)。待用户 launchctl load 生效。
  - id: sector_daily
    description: "板块每日研判(收盘后 17:30·选股前):面板/角色/两步/综合研判+新闻标签;唯一在编板块日更,取代19:45"
    cmd: ["python", "-m", "tools.analysis.sector_forecast"]
    cron: "30 17 * * mon-fri"
    timeout_sec: 900
    retries: 1
    notify_on: [failure, misfire]
    tags: [local, eod, sector]

  - id: intraday_review
    description: 盘尾复盘(17:00)
    cmd: ["python", "-m", "tools.run", "intraday_review"]
    cron: "0 17 * * mon-fri"
    timeout_sec: 1800
    retries: 1
    depends_on: [pullrefresh]
    notify_on: [failure, misfire]
    tags: [local, eod]

  - id: strong
    description: 最强票刷新(20:00,复用已拉数据 --no-fetch)
    cmd: ["python", "-m", "tools.run", "strong", "--no-fetch"]
    cron: "0 20 * * mon-fri"
    timeout_sec: 1800
    retries: 1
    notify_on: [failure, misfire]
    tags: [local, eod]

  # commitdocs 每工作日两固定时刻 13:30(午盘后)+ 22:40(夜间收尾):两时刻分钟不同,单条 cron
  # 无法表达 → 用 cron 列表(多 trigger 并集,见 TaskSpec.build_trigger 的 OrTrigger)。
  # 2026-09 由"11:20-22:20 每小时"精简为两时刻:以 LIVE 现值为准,plist SCI 与本 cron 列表并集严格等价
  # (test_scheduler_launchd_equivalence 锁)。⚠️ 用 mon-fri(周一~五),对齐 LIVE Weekday 1-5。
  - id: commitdocs
    description: 分析文档定时提交(每工作日 13:30 + 22:40 两次)
    cmd: ["bash", "ops/launchd/commit_analysis_docs.sh"]
    cron: ["30 13 * * mon-fri", "40 22 * * mon-fri"]
    timeout_sec: 300
    retries: 0
    notify_on: [failure]
    tags: [local, docs]

  # ── 以下为历史冗余定义收敛的落点(默认 disabled,不参与影子排期)──
  # SEPA 午收监控:旧在 launchd(已停用)/systemd/进程内 APScheduler 三处;
  # 注册表统一为单条,启用与否由 enabled 控制(收编冗余,SSOT)。
  - id: sepa
    description: "SEPA+VCP 监控(午 11:35 + 收 15:35);收编三处冗余为单条,默认关"
    cmd: ["python", "-m", "tools.run", "sepa"]
    cron: "35 11,15 * * mon-fri"
    timeout_sec: 1200
    retries: 1
    enabled: false
    notify_on: [failure, misfire]
    tags: [local, sepa, consolidated]

  # 每日 forward 影子跑(v2r 扩样·纯 dry-run 旁路):**当前作为 pull_refresh.sh 盘后闭环(=pullrefresh
  # plist)的最末尾 best-effort 步骤执行,无独立 launchd plist**。本条为 SSOT 留痕 / P3 独立化候选:
  # 若将来 P3 把它从闭环拆成独立任务,启用本条并建对应 plist(二选一,勿与闭环步骤双跑)。
  # 无 plist → 不被 tasks.yaml↔launchd 等价测试比对;默认 disabled(不参与影子排期)。cron 取闭环
  # 预计跑完后的名义时点(仅声明,enabled=false 不实际排期)。
  - id: shadow_forward
    description: "每日forward影子跑(v2r扩样,DeepSeek研判候选池→forward证据库→样本外α);当前为pull_refresh闭环末尾步骤,本条留痕/P3独立化候选,默认关"
    cmd: ["python", "-m", "tools.run", "shadow_forward"]
    cron: "30 17 * * mon-fri"
    timeout_sec: 1800
    retries: 0
    enabled: false
    depends_on: [pullrefresh]
    notify_on: [failure]
    tags: [local, eod, shadow, forward]

  # git autopush:非业务产出,守护类,默认关(影子期不排期)
  - id: autopush
    description: git 自动推送(15:30);非选股业务,默认关
    cmd: ["bash", "ops/launchd/autopush.sh"]
    cron: "30 15 * * mon-fri"
    timeout_sec: 300
    retries: 0
    enabled: false
    notify_on: [failure]
    tags: [local, git]

  # ────────────────────────────────────────────────────────────────────
  # 午盘 Q(14:30 首判 + 14:50 复核 → 尾盘买 → 次日尾盘卖)
  #
  # 为什么要 3 个专用快照 job,而不复用现有 com.stock.intraday(slot=1030):
  #   共用的 intraday_snapshot.sh 裸调 --slot、不传 --codes → 落到 resolve_targets()
  #   的默认标的「上一交易日选股 ∪ 自选池」(约18只),那是"跟踪已知标的"语义;
  #   午盘 Q 要的是"扫固定焦点池126只找新候选"。实证 2026-09-16:不传 --codes 的
  #   1430 快照只覆盖焦点池 6/126(4.8%)→ 选股结果无效。
  #   按 M1 契约稿 §一:**共用采集脚本零改**,午盘Q只加自己的 wrapper/plist 传对参数。
  #
  # breadth_1430/1450:现有 com.stock.breadth 只跑 15:05(slot=1505),覆盖不到午盘Q
  #   判定时点;market_breadth.sh 已由 BREADTH_SLOT 参数化 → 零改脚本,只加 plist。
  #
  # 时序(launchd 无 job 依赖机制 → M1契约§六.3 方案α 固定错峰;
  #      StartCalendarInterval 不支持秒,粒度=分钟):
  #   10:30  快照 1030 ── Q1 AmPmRatio 的上午量能基准(缺则降级用 vol_ratio,
  #                        实测 94% 的票都能过阈值 → 该过滤形同虚设)
  #   14:30  快照 1430 + breadth 1430
  #   14:31  gate+screen 1430(首判)
  #   14:50  快照 1450 + breadth 1450
  #   14:51  gate+screen 1450(复核,与首判交叉确认)
  #   14:53  gate+screen final(合并两段;闸门翻转到弱势/崩盘则强制清空)
  #
  # ⚠️ 全部 enabled: false —— 午盘Q三条策略 M3.a 回测**均未达标**(按 _回测与评估口径.md
  #   §五 裁决:回撤 -20%~-62% 远超 -10% 红线,且 Q1/Q2 超额收益为负、bootstrap 95%CI
  #   跨 0 不显著)。这些 job 的作用是**为 M3.b 分时回测积累真实快照**(需 60 交易日),
  #   属数据采集,不代表策略可上生产。装载与否由用户决定(runbook 明示 agent 不执行 launchctl)。
  - id: midday_q_snapshot_1030
    description: "午盘Q专用快照 10:30(焦点池126只;Q1 AmPmRatio 的上午量能基准)"
    cmd: ["bash", "ops/launchd/midday_q_snapshot.sh"]
    cron: "30 10 * * mon-fri"
    timeout_sec: 600
    retries: 1
    enabled: false
    notify_on: [failure, misfire]
    tags: [local, intraday, midday_q]

  - id: midday_q_snapshot_1430
    description: "午盘Q专用快照 14:30(焦点池126只;首判数据源)"
    cmd: ["bash", "ops/launchd/midday_q_snapshot.sh"]
    cron: "30 14 * * mon-fri"
    timeout_sec: 600
    retries: 1
    enabled: false
    notify_on: [failure, misfire]
    tags: [local, intraday, midday_q]

  - id: midday_q_snapshot_1450
    description: "午盘Q专用快照 14:50(焦点池126只;复核数据源)"
    cmd: ["bash", "ops/launchd/midday_q_snapshot.sh"]
    cron: "50 14 * * mon-fri"
    timeout_sec: 600
    retries: 1
    enabled: false
    notify_on: [failure, misfire]
    tags: [local, intraday, midday_q]

  - id: breadth_1430
    description: "全A广度 14:30 slot(午盘Q闸门 G3/G4/G5 用;复用 market_breadth.sh)"
    cmd: ["python", "-m", "tools.pipeline.market_breadth", "--slot", "1430"]
    cron: "30 14 * * mon-fri"
    timeout_sec: 600
    retries: 1
    enabled: false
    notify_on: [failure, misfire]
    tags: [local, intraday, breadth, midday_q]

  - id: breadth_1450
    description: "全A广度 14:50 slot(午盘Q闸门 G3/G4/G5 用;复用 market_breadth.sh)"
    cmd: ["python", "-m", "tools.pipeline.market_breadth", "--slot", "1450"]
    cron: "50 14 * * mon-fri"
    timeout_sec: 600
    retries: 1
    enabled: false
    notify_on: [failure, misfire]
    tags: [local, intraday, breadth, midday_q]

  - id: midday_q_1430
    description: "午盘Q 首判 14:31(gate.stage1_1430 + screen.stage1_1430)"
    cmd: ["bash", "ops/launchd/midday_q_pipeline.sh"]
    cron: "31 14 * * mon-fri"
    timeout_sec: 900
    retries: 1
    enabled: false
    depends_on: [midday_q_snapshot_1430, breadth_1430]
    notify_on: [failure, misfire]
    tags: [local, intraday, midday_q, screen]

  - id: midday_q_1450
    description: "午盘Q 复核 14:51(gate.stage2_1450 + screen.stage2_1450;与首判交叉确认)"
    cmd: ["bash", "ops/launchd/midday_q_pipeline.sh"]
    cron: "51 14 * * mon-fri"
    timeout_sec: 900
    retries: 1
    enabled: false
    depends_on: [midday_q_snapshot_1450, breadth_1450, midday_q_1430]
    notify_on: [failure, misfire]
    tags: [local, intraday, midday_q, screen]

  - id: midday_q_final
    description: "午盘Q 收官 14:53(合并两段;闸门翻转到弱势/崩盘则强制清空)"
    cmd: ["bash", "ops/launchd/midday_q_pipeline.sh"]
    cron: "53 14 * * mon-fri"
    timeout_sec: 600
    retries: 1
    enabled: false
    depends_on: [midday_q_1450]
    notify_on: [failure, misfire]
    tags: [local, intraday, midday_q, screen]
